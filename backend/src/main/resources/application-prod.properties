spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:db_restaurante}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:restaurante_app}
spring.datasource.password=${DB_PASSWORD:SET_A_STRONG_PASSWORD_IN_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
